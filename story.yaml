    You liked to haunt these abandoned buildings in the woods. It's where you got many of your ideas - for movies, for halloween costumes, for things to say to your best friend to make her laugh or think higher of you. Not all the ideas you got there were good, you guess.

    But they were yours, and you didn't care if they made people think you're weird, because nobody could judge you if they never made it out of the woods.

    You always make your Halloween costumes in particular from absolute scratch. It's one of those things you always feel extremely proud of.

    Would that look good on the college application?
