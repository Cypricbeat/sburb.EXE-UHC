    [spoiler open="Open Thoughtlog" close="Hide Thoughtlog"]
    <div style="text-align: center;"><span style="color: #ff5900;">The Randy Meeks Of Rollercoasters


    In a way, horror movies are a lot like rollercoasters. Fear is the appeal, and a lot of engineering goes into making them actually scary. And like horror movies, rollercoasters generally have rules, and once youve been on enough coasters, you generally wise up to the rules. You know when a drop is coming, and that the drop might be followed by a sweet Loop-De-Loop

    Man what if we had meta rollercoasters. What if you built a rollercoaster as a commentary on the structures and rules of rollercoasters??? After they make one of those they should make an euthanasia coaster of movies I think

    The rules of survival for people on the rollercoaster are pretty straightforward

    1. Keep your butt seated
    2. You need to be this tall to ride
    3. Dont ride if you have been implanted recently with a cuntburster parasite

    Its not so straightforward for the random guy that decided to wander onto the rollercoaster tracks though. Thats not the rules of engagement with the rollercoaster! He has to make shit up as he goes!!! And if he doesnt think fast, guy becomes red misted faster than he can say 'fuck my fucking life'

    Thats kind of what being in a horror movie would be like, I think. Standing in the way of the rollercoaster</span>

    <span style="font-style: italic;">THOUGHT INTERNALIZED</span>

    <span style="color: #ff5900;">I think if the guy spent all of his days thinking about being red misted by a coaster, hed probably be ready and leap out of the way in time. I think if there was a Randy Meeks of Rollercoasters to teach him the rules of Coasterdodging, hed turn out fine

    A horror fan doesnt need to invent a Randy Meeks of Horror Movies, because Randy Meeks is the Randy Meeks of Horror Movies. So I think horror movie fans could survive horror movies because we know all the rules (thanks to Randy Meeks), and unlike coaster fans, we actually think about being murdered by the object of our affections every day of our lives

    Okay, well. To be fair Randy Meeks actually dies in Scream? But Scream was a deconstruction of a horror movie so that doesnt count. Youd be a very unlucky horror fan to be in a horror deconstruction movie XP</span></div>

