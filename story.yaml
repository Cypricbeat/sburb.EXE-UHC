    Other days, you'd find buildings.

    And maybe you'd go in and explore, and find graffiti and cigarette packages of a brand last sold in the USSR at the tail end of the 80s, and have wondered if the person who smoked them was even still alive and how their smokes got from Russia to the Middle of Nowhere, Texas.

    You took the package home to try one but pop found and got rid of it by the time you got your hands on a lighter.
