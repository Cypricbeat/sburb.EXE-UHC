    A small human girl child rushes to save herself from the consequences of her own actions.

    Death is all this child has ever known. Her whole life had prepared her to rise up against the odds and use her knowledge to guide her race against monsters both real and imagined.

    But watch, how when faced with the finality of her own existence, she gapes and flounders and wastes her time. For at her core, she is no leader. At her core, she is still a whimpering, mewling little monster predestined to never amount to much of anything.

