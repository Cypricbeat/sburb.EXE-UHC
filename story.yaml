    It was a different thing each time that you could look back on and, in retrospect, have deemed a marker of a good day in Telephone.

    It'd usually be something small like overhearing a strange conversation between the neighbors, or finding a bird carcass maimed in a unique enough way, or hallucinating a shape in the powerlines that was gone the second you blinked.

    You may be a bit strange for this, you guess, but all that stuff would make you look hopefully towards the future.

    [color=#ff9500]Someday soon Ill go to college and learn how movies are made and Ill cram all these teeny tiny things into a movie and itll be scarier than anything anyone has ever seen[/color]

    Most good days were also ones where pop wasn't on your damn case.

    But even more moster often, you think, it'd be the ones you could get lost in the nearby woods. You guess you must have been looking for something.

    Usually you'd just find animal scat and garbage dumped by some unruly local teens though.
