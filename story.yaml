    You lap up the bitter fishblood. At times like these, BLOOD reminds you why you keep going.

    "Pathetic," you mutter, flicking the red off your blade. This isn't a punishment; it's an insult. A waste of your goddamn time. And for what? Some jumped-up kids thinking they can put you down like a dog. They think they're so clever, but they’ll learn. They’ll all learn. You're not just going to Make Them Pay. No, that'd be too easy. You'll grind them down, one by one, until they beg for a death you will not grant.

    You don’t need a kingdom. You don't need a ring. All you need is the knife in your hand and the rage burning under your carapace. It is a rage hot enough to burn worlds.

    You spit the repulsive fishblood on the ground, glaring up at the ash-choked sky.

    It is a long way back to Derse.
