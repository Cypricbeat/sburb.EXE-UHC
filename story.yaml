    Once again, you summon your shoe, drawing your first HAND.

    Your modus is built with extensive weaponization in mind. Every object in your inventory is assigned a card with a value; with the numbered cards having their value right in their names ([color=#ff0d13]4 of Diamonds = 4[/color]), and all the cards with the characters on them having a value of 10 ([color=#ff0d13]King of hearts = 10[/color], giving your current hand a total value of [color=#ff0d13]14[/color]). Aces have a value of [color=#ff0d13]1[/color]1, unless the total value would send you over [color=#ff0d13]21[/color], in which case the value is reduced to a measly [color=#ff0d13]1[/color].

    At any point, you can choose to 'play' your hand - either safely uncaptchalogue the items available, or launch them at terminal velocity at whatever is in the way.

    You can also choose to 'hit' - draw the next card from the shoe, and add it to your hand.

    Getting a value of 21 will net you a CRITICAL HIT.

    Going over 21 will unleash the syllawhirlwind BACK ON YOURSELF, WHICH IS GENERALLY NOT GOOD.

    If you're confused, just go and reread the page. It's literally just the rules of Blackjack. Even a lobotomy patient could get it.

    Looks like you have drawn a PAIR OF REVOLVERS and a COOL MACE. The former is not really your style, whilst you could make the latter work, you guess.

    What is your next move?
