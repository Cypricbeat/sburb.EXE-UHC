    Not, like, literally, obviously. Your house is right here after all. You mean the home that, ontologically speaking, no longer exists. Your home that is back in a little town called TELEPHONE, TEXAS - Which you are not confident still exists on Earth either.

    Oh, TELEPHONE... How flawed you were. How lonely. How riddled with roadkill. TV promised you that you'd one day find a dead person in your woods, and that may have been exciting for a while. But you never even delivered on that.

    You did not deserve to get vaporized by meteors.

    You think you may not actually have a home to go back to anymore, and you can't get that gnawing feeling that it is somehow your fault out of your mind.
