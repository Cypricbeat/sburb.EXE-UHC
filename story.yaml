    <div><span style="color: #ff8d51;">SB: Up, up above, beyond the <span style="text-decoration: underline;">Seven Gates</span> and <span style="text-decoration: underline;">The Medium</span>, A great war is being fought in the Heavens. 'Tis a battle not for land or for glory, nor for a nation or an idea; But a war for <span style="text-decoration: underline;">Skaia</span>, a dormant crucible of endless creative potential. It is a war between the very forces of Light, charged with its protection; and the forces of Dark, charged with its annihilation

    SB: A war Darkness is always, always going to win

    SB: The heroes - thats you lot - take on the role of exiled nobility, returning to their <span style="text-decoration: underline;">Land</span> after being driven out by an evil almost as vile and nearly as dangerous as yours truly - <span style="text-decoration: underline;">The Denizen</span>

    SB: Your goal is to build a <span style="text-decoration: underline;">Tower of Syndetic Ascension</span>, past the Seven Gates and all the way up to Skaia in order to stake your claim on the very thing the two armies are fighting over: <span style="text-decoration: underline;">The Ultimate Reward</span>

    SB: But it is not quite as simple as just waltzing up to the battlefield and saying, yo this is mine now!

    You may be a noble, yes; but without any Land, you are politically irrelevant. You have no right to participate in the contest</span></div>
